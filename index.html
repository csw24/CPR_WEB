<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교육생 입장 | XI:ON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 20% 0%,#fafdff,#eaf3fc 72%); font-family:'DM Sans','Noto Sans KR',sans-serif; color:#14254b; }
    .card { width:min(100%,480px); padding:42px 36px; background:white; border:1px solid #e1f0f7; border-radius:28px; box-shadow:0 15px 40px #466b9620; }
    .logo { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:14px; }
    .heart { width:56px; height:56px; display:grid; place-items:center; border-radius:15px; color:white; background:linear-gradient(135deg,#64dfd3,#0ba9b8); font-size:34px; }
    h1 { margin:0; font-size:36px; letter-spacing:-1px; }
    .subtitle { text-align:center; color:#6684a5; margin:0 0 30px; }
    label { display:block; margin:18px 0 8px; color:#126e7c; font-weight:800; }
    input { display:block; width:100%; padding:14px 15px; font:600 16px 'Noto Sans KR',sans-serif; border:1px solid #cbdbe9; border-radius:11px; outline-offset:2px; }
    input:focus { outline:2px solid #0c9eaa; }
    button { width:100%; margin-top:26px; padding:15px; border:0; border-radius:12px; background:#0c9eaa; color:white; font:800 16px 'Noto Sans KR',sans-serif; cursor:pointer; }
    button:hover { background:#087d89; }
    .help { text-align:center; margin:16px 0 0; font-size:12px; line-height:1.7; color:#6684a5; }
    .error { color:#b54735; min-height:20px; font-size:13px; margin-top:12px; text-align:center; }
    @media(max-width:500px){ .card {padding:30px 22px;} }
  </style>
</head>
<body>
  <section class="card" aria-label="교육생 입장">
    <div class="logo"><div class="heart" aria-hidden="true">♥</div><h1>XI:ON</h1></div>
    <p class="subtitle">CPR Training Analytics</p>
    <form id="entryForm">
      <label for="st1">ST1 교육생 ID</label>
      <input id="st1" name="st1" placeholder="예: 스파이더맨" maxlength="40" autocomplete="off" required>
      <label for="st2">ST2 교육생 ID</label>
      <input id="st2" name="st2" placeholder="예: 아이언맨" maxlength="40" autocomplete="off" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit">클래스 입장하기</button>
    </form>
  </section>
  <script>
    document.getElementById('entryForm').addEventListener('submit', event => {
      event.preventDefault();
      const A = document.getElementById('st1').value.trim();
      const B = document.getElementById('st2').value.trim();
      const error = document.getElementById('error');
      if (!A || !B) { error.textContent='두 교육생 ID를 모두 입력해 주세요.'; return; }
      if (A === B) { error.textContent='ST1과 ST2에는 서로 다른 ID를 입력해 주세요.'; return; }
      sessionStorage.setItem('xionParticipants', JSON.stringify({ A, B }));
      location.assign('dashboard.html');
    });
  </script>
</body>
</html>
